name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber tests
        id: cucumber
        run: npx cucumber-js
        continue-on-error: true

      - name: Generate results.json
        run: npm run report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/results.json

      - name: Publish results to QA dashboard
        if: always()
        run: |
          curl -sf -X POST "https://qa.zanuar.dev/api/results/bdd-cucumber-playwright" \
            -H "Authorization: Bearer ${{ secrets.QA_DASHBOARD_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data @results/results.json \
          || echo "::warning::failed to publish results to qa.zanuar.dev, dashboard may be stale"

      - name: Fail build if tests failed
        if: steps.cucumber.outcome == 'failure'
        run: exit 1
